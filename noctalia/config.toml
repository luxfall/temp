[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.64999998547136784
center = []
end = [ "tray", "group:g1", "clock", "session" ]
font_family = "Inter"
font_weight = 400
margin_edge = 5
margin_ends = 160
radius = 14
scale = 0.80000000000000004
start = [ "workspaces", "active_window" ]
thickness = 25
widget_spacing = 8

[[bar.default.capsule_group]]
fill = "surface_variant"
id = "g1"
members = [ "notifications", "clipboard", "network", "brightness", "bluetooth", "volume", "input_volume", "battery" ]
opacity = 1.0
padding = 10.0

[desktop_widgets]
enabled = false

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

[lockscreen_widgets.grid]
cell_size = 8
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 64.0
box_width = 464.0
cx = 640.0
cy = 408.0
output = "eDP-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
input_opacity = 1.0
input_radius = 6.0
show_login_button = true

[lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
box_height = 128.0
box_width = 472.0
cx = 640.0
cy = 288.0
output = "eDP-1"
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
clock_style = "digital"

[nightlight]
enabled = true
force = true
temperature_day = 3600

[shell]
font_family = "Inter"
ui_scale = 0.85000000521540642

[shell.panel]
open_near_click_control_center = true

[[shell.session.actions]]
action = "lock"
command = "hyprlock"
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
enabled = false
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
enabled = true
shortcut = "5"
variant = "destructive"

[[shell.session.actions]]
action = "suspend"
enabled = true
variant = "default"

[system.monitor]
enabled = false

[theme]
source = "wallpaper"

[theme.templates]
builtin_ids = [ "foot", "gtk3", "gtk4", "hyprland", "kcolorscheme", "qt" ]
community_ids = [ "neovim", "fuzzel", "discord", "papirus-icons", "steam", "yazi" ]

[wallpaper]
directory = "~/Pictures"

[weather]
enabled = false

[widget.active_window]
capsule = true
capsule_padding = 10.0
display = "text_only"

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.input_volume]
show_label = false

[widget.network]
show_label = false

[widget.tray]
match_adjacent_spacing = true

[widget.volume]
show_label = false

[widget.workspaces]
active_pill_size = 2.8000000000000003
display = "none"
pill_scale = 0.70000000000000007
