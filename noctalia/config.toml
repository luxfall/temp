[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.64999998547136784
center = []
end = [ "tray", "group:g1", "clock", "session" ]
font_family = "Inter"
font_weight = 400
margin_edge = 5
margin_ends = 160
radius = 14
scale = 0.80000000000000004
start = [ "workspaces", "active_window" ]
thickness = 25
widget_spacing = 8

    [[bar.default.capsule_group]]
    fill = "surface_variant"
    id = "g1"
    members = [ "notifications", "clipboard", "network", "brightness", "bluetooth", "volume", "input_volume", "battery" ]
    opacity = 1.0
    padding = 10.0

[calendar]

[control_center.calendar]
show_events_card = false

[desktop_widgets]
enabled = false

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 588.60003662109375
    output = "Virtual-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 64.0
    box_width = 416.0
    cx = 640.0
    cy = 392.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.0
        background_radius = 0.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = false
        show_keyboard_layout = false
        show_login_button = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 367.5
    output = "Virtual-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        center_text = true
        clock_style = "digital"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 208.0
    box_width = 440.0
    cx = 640.0
    cy = 328.0
    output = "eDP-1"
    rotation = 0.0
    type = "label"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background_opacity = 0.40000000000000002
        title = ""

[nightlight]
enabled = true
force = true
temperature_day = 2900
temperature_night = 2800

[shell]
app_icon_colorize = true
font_family = "Inter"
lang = "en"
polkit_agent = false

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false
    compact = true

    [shell.panel]
    open_near_click_control_center = true

    [shell.session]
    grid_columns = 5

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

        [[shell.session.actions]]
        action = "suspend"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

[system.monitor]
enabled = false

[theme]
builtin = "Noctalia"
custom_palette = "Matugen"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = []
    community_ids = []
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "~/Pictures"

[weather]
enabled = false

[widget.active_window]
capsule = true
capsule_padding = 10.0
display = "text_only"

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.input_volume]
show_label = false

[widget.network]
show_label = false

[widget.tray]
match_adjacent_spacing = true

[widget.volume]
show_label = false

[widget.workspaces]
active_pill_size = 2.8000000000000003
pill_scale = 0.70000000000000007
show_labels = false

