
[config.custom_colors]
ansi_blue = "#3b82f6"
ansi_magenta = "#d946ef"
ansi_cyan = "#22d3ee"
success = { color = "#4caf50", blend = true }
warning = { color = "#ffb300", blend = true }

[templates.hyprland]
input_path  = "~/.config/matugen/templates/hypr/matugen.lua"
output_path = "~/.config/hypr/modules/matugen.lua"
post_hook   = "hyprctl reload"

[templates.qt]
input_path  = "~/.config/matugen/templates/qt/matugen.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.kde]
input_path  = "~/.config/matugen/templates/kde/Matugen.colors"
output_path = "~/.config/kdeglobals"

[templates.dolphin]
input_path  = "~/.config/matugen/templates/kde/Matugen.colors"
output_path = "~/.local/share/color-schemes/Matugen.colors"

[templates.foot]
input_path  = "~/.config/matugen/templates/foot/matugen.ini"
output_path = "~/.config/foot/matugen.ini"

[templates.tmux]
input_path  = "~/.config/matugen/templates/tmux/matugen.conf"
output_path = "~/.config/tmux/themes/matugen.conf"

[templates.vencord]
input_path  = "~/.config/matugen/templates/vencord/matugen.css"
output_path = "~/.config/vesktop/themes/matugen.css"

[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk/matugen.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk/matugen.css"
output_path = "~/.config/gtk-4.0/gtk.css"


